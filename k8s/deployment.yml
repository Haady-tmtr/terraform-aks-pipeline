apiVersion: apps/v1
kind: Deployment
metadata:
  name: terraform-aks-pipeline-app
  labels:
    app: terraform-aks-pipeline-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: terraform-aks-pipeline-app
  template:
    metadata:
      labels:
        app: terraform-aks-pipeline-app
    spec:
      containers:
        - name: app
          image: terraformakspipelineacr.azurecr.io/terraform-aks-pipeline-app:latest
          ports:
            - containerPort: 5000
          readinessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 10
            periodSeconds: 20